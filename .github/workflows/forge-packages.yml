name: Forge launcher packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Clonedivers/**', 'Clonedivers.Linux/**', 'Clonedivers.ForgeBridge/**', 'tools/**', 'docs/FORGE-MIGRATION.md', 'docs/forge-preset-build25480438.json', '.github/workflows/forge-packages.yml']
  pull_request:
    paths: ['Clonedivers/**', 'Clonedivers.Linux/**', 'Clonedivers.ForgeBridge/**', 'tools/**', 'docs/FORGE-MIGRATION.md', 'docs/forge-preset-build25480438.json', '.github/workflows/forge-packages.yml']
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - shell: pwsh
        run: ./tools/fetch-presentmon.ps1
      - name: Build the migration executable
        shell: pwsh
        run: |
          dotnet publish Clonedivers -c Release -o artifacts/windows -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item artifacts/windows/Clonedivers.exe
          if ($exe.VersionInfo.FileVersion -ne '2.1.3.0') { throw 'Unexpected Windows version.' }
          Copy-Item LICENSE artifacts/windows/LICENSE-CLONEDIVERS.txt
          Copy-Item docs/FORGE-MIGRATION.md artifacts/windows/README.md
          Copy-Item docs/FORGE-0.4-TURNKEY-2026-11-05.md artifacts/windows/FORGE-0.4-INTEGRATION.md
          Copy-Item docs/SEAF-COMPATIBILITY-PERMISSION.md artifacts/windows/SEAF-COMPATIBILITY-PERMISSION.md
          Copy-Item docs/releases/pack-2026.11.09-r47-full.md artifacts/windows/EMPIREDIVERS-CREDITS.md
          Copy-Item Clonedivers/Resources/forge-gameplay-build25480438-r10.json artifacts/windows/gameplay-catalog.json
          Copy-Item Clonedivers/Licenses/PresentMon.txt artifacts/windows/LICENSE-PresentMon.txt
          Copy-Item Clonedivers.Linux/THIRD-PARTY-NOTICES.txt artifacts/windows/THIRD-PARTY-NOTICES-Avalonia.txt
          foreach ($package in @('microsoft.netcore.app.runtime.win-x64','microsoft.windowsdesktop.app.runtime.win-x64')) {
            $runtime = Get-ChildItem (Join-Path $env:USERPROFILE ".nuget/packages/$package") -Directory | Sort-Object { [version]$_.Name } | Select-Object -Last 1
            foreach ($name in @('LICENSE','LICENSE.TXT','THIRD-PARTY-NOTICES.TXT')) {
              $source = Join-Path $runtime.FullName $name
              if (Test-Path $source) { Copy-Item $source ("artifacts/windows/$package-$name") }
            }
          }
      - name: Check Azure Trusted Signing configuration
        id: check-signing
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Skipping Windows Authenticode signing on pull_request event; CI stays green."
            exit 0
          }
          $required = @(
            'AZURE_TENANT_ID',
            'AZURE_CLIENT_ID',
            'AZURE_CLIENT_SECRET',
            'AZURE_SIGNING_ENDPOINT',
            'AZURE_SIGNING_ACCOUNT',
            'AZURE_SIGNING_PROFILE'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -eq 0) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Azure Trusted Signing secrets detected; signing artifacts/windows/Clonedivers.exe."
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Skipping Windows Authenticode signing: secrets not configured ($($missing -join ', ')). Packaging unsigned binary; see docs/CODE-SIGNING-SETUP.md."
          }
      - name: Sign Clonedivers.exe with Azure Trusted Signing
        if: steps.check-signing.outputs.enabled == 'true'
        uses: Azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\windows\Clonedivers.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Clonedivers — Forge Launcher
          description-url: https://github.com/owendavidgoode/clonedivers
      - name: Verify Authenticode signature
        if: steps.check-signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -LiteralPath artifacts/windows/Clonedivers.exe
          Write-Host "Authenticode status: $($sig.Status) ($($sig.StatusMessage))"
          if ($sig.Status -ne 'Valid') { throw "Authenticode signature verification failed: $($sig.Status)" }
      - name: Package Windows archive and checksums
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath artifacts/windows/Clonedivers.exe
          $files = @(Get-ChildItem artifacts/windows -File | Select-Object -ExpandProperty FullName)
          Compress-Archive -LiteralPath $files -DestinationPath artifacts/windows/Clonedivers-windows-2.1.3.zip
          (Get-FileHash $exe.FullName).Hash.ToLowerInvariant() + '  Clonedivers.exe' | Set-Content artifacts/windows/SHA256SUMS -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-Windows-migration
          path: artifacts/windows/*
          if-no-files-found: error
  linux-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Test Snap ownership and real Linux metadata
        run: dotnet run --project Clonedivers.Linux.Tests -c Release -p:ForgeEdition=true -- --linux-feedback-only
      - name: Build the complete pinned Forge package
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish Clonedivers.ForgeBridge -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:IncludeSourceRevisionInInformationalVersion=false -o dist/forge-helper
          pwsh -File tools/build-forge-companion.ps1 -BridgeBinary dist/forge-helper/HellForge.Launcher.ClonediversBridge -OutputFolder dist/forge-companion
          dotnet publish Clonedivers.Linux -c Release -p:ForgeEdition=true -r linux-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o dist/forge-native
          mkdir -p dist/forge-stage/licenses artifacts/linux
          cp dist/forge-native/clonedivers dist/forge-stage/clonedivers
          chmod 755 dist/forge-stage/clonedivers
          cp -a dist/forge-companion dist/forge-stage/forge
          chmod 755 dist/forge-stage/forge/HellForge.Launcher.ClonediversBridge
          cp LICENSE dist/forge-stage/LICENSE-CLONEDIVERS.txt
          cp docs/FORGE-MIGRATION.md dist/forge-stage/README.md
          cp docs/FORGE-0.4-TURNKEY-2026-11-05.md dist/forge-stage/FORGE-0.4-INTEGRATION.md
          cp docs/FORGE-MOD-COVERAGE.md dist/forge-stage/FORGE-MOD-COVERAGE.md
          cp docs/forge-author-receipts-20261104.json dist/forge-stage/author-receipts.json
          cp docs/forge-preset-build25480438.json dist/forge-stage/preset.json
          cp docs/SEAF-COMPATIBILITY-PERMISSION.md dist/forge-stage/SEAF-COMPATIBILITY-PERMISSION.md
          cp docs/releases/pack-2026.11.09-r47-full.md dist/forge-stage/EMPIREDIVERS-CREDITS.md
          cp Clonedivers/Resources/forge-gameplay-build25480438-r10.json dist/forge-stage/gameplay-catalog.json
          cp Clonedivers.Linux/THIRD-PARTY-NOTICES.txt dist/forge-stage/licenses/Avalonia-Skia-HarfBuzz.txt
          for rid in linux-x64; do
            runtime=$(find "$HOME/.nuget/packages/microsoft.netcore.app.runtime.$rid" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
            cp "$runtime/LICENSE.TXT" "dist/forge-stage/licenses/dotnet-$rid-LICENSE.TXT"
            cp "$runtime/THIRD-PARTY-NOTICES.TXT" "dist/forge-stage/licenses/dotnet-$rid-NOTICES.TXT"
          done
          jq -n '{format:1,channel:"forge",architecture:"x64",gameBuild:"25480438",engine:"0.1.47",hellforge:"0.4.0-beta",versions:{windows:"2.1.3",linux:"0.10.3",bridge:"0.4.0"},qualification:"Launcher/package migration; actual Linux gameplay and multiplayer unqualified",includesGameOrThirdPartyMods:false}' > artifacts/linux/clonedivers-forge-channel.json
          cp artifacts/linux/clonedivers-forge-channel.json dist/forge-stage/clonedivers-forge-channel.json
          bash tools/package-forge-portable.sh dist/forge-stage artifacts/linux/Clonedivers-linux-x64.tar.gz
          bash tools/package-forge-deb.sh dist/forge-stage 0.10.3 artifacts/linux/Clonedivers-linux-x64.deb
          cd artifacts/linux
          sha256sum Clonedivers-linux-x64.tar.gz Clonedivers-linux-x64.deb clonedivers-forge-channel.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-Linux-migration
          path: artifacts/linux/*
          if-no-files-found: error
  linux-package-qa:
    needs: linux-package
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Forge-Linux-migration
          path: artifacts/linux
      - name: Install headless desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth fonts-dejavu-core libx11-6 libice6 libsm6 libfontconfig1 libgl1 libegl1
      - name: Verify complete package, installed entry point and checksums
        run: bash tools/qa-forge-package.sh artifacts/linux
      - name: Upload Forge GUI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forge-Linux-GUI-${{ matrix.os }}
          path: artifacts/linux/gui-smoke/
          if-no-files-found: warn
