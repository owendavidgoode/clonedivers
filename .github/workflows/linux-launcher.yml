name: Legacy Steam launcher checks
on:
  workflow_dispatch:
  push:
    branches: [main, codex/linux-launcher, codex/linux-diagnostics, codex/linux-gui, codex/linux-tui, codex/linux-steam-routing, codex/linux-updates]
    paths:
      - 'Clonedivers/**'
      - 'Clonedivers.Linux/**'
      - 'Clonedivers.Linux.Tests/**'
      - '.github/workflows/linux-launcher.yml'
      - 'docs/LINUX.md'
      - 'tools/qa-linux-package.sh'
      - 'tools/qa-linux-mangohud.sh'
      - 'tools/package-linux-deb.sh'
  pull_request:
    paths:
      - 'Clonedivers/**'
      - 'Clonedivers.Linux/**'
      - 'Clonedivers.Linux.Tests/**'
      - '.github/workflows/linux-launcher.yml'
      - 'tools/qa-linux-package.sh'
      - 'tools/qa-linux-mangohud.sh'
      - 'tools/package-linux-deb.sh'
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install desktop and recording smoke-test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mangohud xvfb vulkan-tools mesa-vulkan-drivers libice6 libsm6 libfontconfig1
      - name: Test Linux installation and recovery
        env:
          CLONEDIVERS_GUI_SCREENSHOT: ${{ github.workspace }}/artifacts/Clonedivers-linux-gui.png
          CLONEDIVERS_TUI_TRANSCRIPT: ${{ github.workspace }}/artifacts/Clonedivers-terminal.ansi
        run: |
          mkdir -p artifacts
          dotnet run --project Clonedivers.Linux.Tests -c Release -p:ForgeEdition=false
      - name: Publish self-contained Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          version=$(dotnet msbuild Clonedivers.Linux/Clonedivers.Linux.csproj -nologo -p:ForgeEdition=false -getProperty:Version)
          for arch in x64 arm64; do
            dotnet publish Clonedivers.Linux -c Release -p:ForgeEdition=false -r linux-$arch --self-contained true -o dist/linux-$arch -p:DebugType=None -p:DebugSymbols=false
            cp docs/LEGACY-LINUX.md dist/linux-$arch/README.md
            cp LICENSE dist/linux-$arch/LICENSE
            cp Clonedivers.Linux/THIRD-PARTY-NOTICES.txt dist/linux-$arch/THIRD-PARTY-NOTICES.txt
            chmod +x dist/linux-$arch/clonedivers
            tar -C dist/linux-$arch -czf artifacts/Clonedivers-linux-$arch.tar.gz clonedivers README.md LICENSE THIRD-PARTY-NOTICES.txt
            bash tools/package-linux-deb.sh dist/linux-$arch/clonedivers "$arch" "$version" artifacts/Clonedivers-linux-$arch.deb
          done
          ./dist/linux-x64/clonedivers --help
          ./dist/linux-x64/clonedivers --version
          cd artifacts
          sha256sum Clonedivers-linux-*.tar.gz Clonedivers-linux-*.deb > SHA256SUMS
      - name: Verify a real MangoHud recording with software Vulkan
        run: bash tools/qa-linux-mangohud.sh dist/linux-x64/clonedivers
      - uses: actions/upload-artifact@v4
        with:
          name: Clonedivers-linux
          path: artifacts/*
          if-no-files-found: error
  package-qa:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: Clonedivers-linux
          path: artifacts
      - name: Verify extracted packages and run real executable integration tests
        run: bash tools/qa-linux-package.sh artifacts
