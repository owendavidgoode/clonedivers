; Empire & Clone Camera Pullback (clonedivers.empire-camera-pullback 0.1.1)
; Per-player third-person camera framing for Helldivers 2 build 25480438.
; Purely visual (gameplay: false, coop: per-player); weapon ballistics and aim stay untouched.

[general]
enabled = true
; Optional Super Destroyer walk support (HF_STATE_SHIP). Default false (missions only).
ship_walk_enabled = false
; Smooth blend-in duration (seconds) when entering standard 3P follow.
; Bypass (ADS, first-person sights, scopes, map, cutscenes, terminal, death) is always instant (0.0s).
blend_in_seconds = 0.18
; Minimum clearance (metres) kept from walls, ceilings, and bulkheads via Havok raycast.
wall_safety_margin = 0.28
; Minimum vertical FOV (radians) for standard on-foot 3P follow (~0.96 rad / 55 deg default).
; Zooming or aiming below this immediately restores the unmodified engine camera.
fov_min = 0.85
; Minimum vertical FOV (radians) while piloting a combat walker so 3P RMB aiming keeps hull clearance.
walker_fov_min = 0.70
; Maximum vertical FOV (radians) accepted as standard gameplay camera.
fov_max = 1.65
; Minimum camera-to-head distance (metres); below this is first-person iron sights / FirstPersonVR.
sights_distance_min = 0.55
; Maximum camera-to-head distance (metres) considered standard on-foot 3P follow.
on_foot_distance_max = 5.50
; Optional Windows virtual-key hex code to toggle pullback in mission (0 = disabled, e.g. 0x78 for F9).
toggle_vk = 0x00
; Fail-closed gate for unverified raw game.dll .data spring-arm writes (reserved; kept off in 0.1.1).
allow_experimental_spring_arm = false

[walker]
; Occupied EXO-45 / EXO-49 / EXO-51 / EXO-55 combat walkers (Clonedivers AT-TE & standard walkers).
walker_enabled = true
walker_pullback_distance = 2.80
walker_lift_z = 1.65
; Auto-detected EmpireDivers 2.28x film-scale AT-ST (cabin node > 3.50m above walker root).
atst_scaled_pullback_distance = 3.80
atst_scaled_lift_z = 2.65

[lego]
; Equipped Compact LEGO 3P kits (verified across all 61 Empire & Clone garment resources + node counts).
; Set lego_pullback_distance = 0.00 and lego_lift_z = 0.00 for completely neutral on-foot framing.
lego_enabled = true
lego_pullback_distance = 0.25
lego_lift_z = -0.06
