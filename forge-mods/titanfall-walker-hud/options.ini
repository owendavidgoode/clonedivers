; AT-TE Titanfall Tactical Cockpit HUD (clonedivers.titanfall-walker-hud 0.1.0)
; Purely visual client-side HUD & optional 1P/3P dual-view walker camera (gameplay: false, coop: per-player).

[general]
enabled = true
hud_enabled = true
; Keep false so 106-node Empire 2.28x AT-ST walkers stay uncluttered unless explicitly opted in.
enable_on_atst = false
; Master visor HUD opacity (0.15 .. 1.00).
hud_opacity = 0.90
; Optional virtual-key code to toggle HUD visibility while piloting (0x00 = disabled).
hud_toggle_vk = 0x00

[camera]
; Allows toggling between 3P Tactical follow camera and 1P Forward-Canopy cockpit view.
dual_view_enabled = true
; Virtual-key code to toggle 1P Canopy / 3P Tactical view while piloting (0x76 = F7; avoids F8 HellForge editor).
dual_view_vk = 0x76
; Start directly in 1P Forward-Canopy view upon boarding a walker (false = start in 3P Tactical).
start_in_first_person = false
; 1P forward-canopy viewport offset relative to AT-TE walker root (meters: +forward, +up).
fp_forward_offset = 2.35
fp_up_offset = 2.85
; Minimum Havok physics raycast clearance (meters) from terrain/walls in 1P Canopy view.
wall_safety_margin = 0.28
